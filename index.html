async function copyT(t){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(_){}x.remove()}toast("تم النسخ ✓")}
async function shareT(t,u){if(navigator.share){try{await navigator.share({title:"صدقة جارية",text:t,url:u})}catch(e){}}else copyT(u?t+"\n"+u:t)}
function hijri(d){try{return new Date(d+"T12:00:00").toLocaleDateString("ar-EG-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"})}catch(e){return""}}
function greg(d){try{return new Date(d+"T12:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function annDays(date){if(!date)return null;const d=new Date(date+"T12:00:00");if(isNaN(d))return null;const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());let x=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(x<t)x=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return Math.round((x-t)/864e5)}

 <div class="card"><b style="color:var(--g)">كود التفعيل</b><div class="row" style="margin-top:8px"><input id="ac" placeholder="SJ-XXXX-XXXX" dir="ltr" style="text-align:center"><button class="btn" id="acb" onclick="redeem()">تفعيل</button></div></div>

function duaList(){

/* ===== الدخول والبيانات ===== */
function authErr(e){const c=(e&&e.code)||"";
 if(c.includes("email-already-in-use"))return"الرقم مسجّل بالفعل، سجّل الدخول";
 if(c.includes("invalid-credential")||c.includes("user-not-found")||c.includes("wrong-password"))return"الرقم أو كلمة المرور غير صحيحة";
 if(c.includes("weak-password"))return"كلمة المرور ضعيفة";
 if(c.includes("network"))return"تحقق من اتصال الإنترنت";
 if(c.includes("too-many"))return"محاولات كثيرة، حاول لاحقًا";
 if(c.includes("operation-not-allowed"))return"فعّل Email/Password في Firebase";
 return"حدث خطأ، حاول مرة أخرى"}
async function doAuth(){
 const ph=$("#aP").value.trim().replace(/\s/g,""),pw=$("#aW").value;
 if(!/^01[0125]\d{8}$/.test(ph))return toast("رقم الهاتف غير صحيح");
 if(pw.length<6)return toast("كلمة المرور 6 أحرف على الأقل");
 const b=$("#aB");b.disabled=true;
 try{
  if(amode==="signup"){const n=$("#aN").value.trim();if(!n){b.disabled=false;return toast("اكتب اسمك")}signup={name:n,phone:ph};await FB.createUserWithEmailAndPassword(FB.auth,ph+"@sadaqa.app",pw)}
  else await FB.signInWithEmailAndPassword(FB.auth,ph+"@sadaqa.app",pw);
 }catch(e){toast(authErr(e));b.disabled=false}
}
function needLogin(fn){if(S.u)return fn();afterAuth=fn;amode="signup";go("auth")}
async function loadAll(){
 const ref=FB.doc(FB.db,"users",S.u.uid);
 let s=await FB.getDoc(ref);
 if(!s.exists()){await FB.setDoc(ref,{name:signup.name||"",phone:signup.phone||S.u.email.split("@")[0],proUntil:0,createdAt:Date.now()});s=await FB.getDoc(ref)}
 S.ud=s.data();
 const q=await FB.getDocs(FB.collection(FB.db,"users",S.u.uid,"profiles"));
 S.profiles=q.docs.map(d=>d.data()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

/* ===== الإجراءات ===== */
function newP(){needLogin(()=>{if(S.profiles.length>=1&&!isPro())return requirePro("multi",()=>go("form"));go("form")})}
function fav(i){S.favs=S.favs.includes(i)?S.favs.filter(x=>x!==i):[...S.favs,i];try{localStorage.setItem(FK,JSON.stringify(S.favs))}catch(e){}$("#dl").innerHTML=duaList()}
function tapZ(k,n){const r=az[k]??n;if(r>0){az[k]=r-1;vib(15);if(r-1===0)vib([40,30,40])}render()}
function tap(){const t=(+localStorage.getItem(TK)||0)+1,tg=+(localStorage.getItem(TK+"g")??33);localStorage.setItem(TK,t);$("#tc").textContent=t;vib(tg&&t%tg===0?[80,40,80]:12);if(tg&&t%tg===0)toast("أتممت "+t+" ✓")}
async function pray(id){const p=find(id);p.count=(p.count||0)+1;$("#cnt").textContent=p.count;vib(20);toast("تقبّل الله دعاءك 🤍");try{await FB.updateDoc(pref(id),{count:FB.increment(1)})}catch(e){}}
async function delP(id){if(!confirm("حذف الملف نهائيًا؟"))return;const p=find(id);try{await FB.deleteDoc(pref(id));if(p&&p.shared)await FB.deleteDoc(FB.doc(FB.db,"pages",id)).catch(()=>{});S.profiles=S.profiles.filter(x=>x.id!==id);render()}catch(e){toast("تعذّر الحذف")}}
function bindForm(){
 $("#fPhoto").addEventListener("click",e=>{if(!isPro()){e.preventDefault();requirePro("photo",()=>$("#fPhoto").click())}});
 $("#fPhoto").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/"))return toast("اختر صورة صالحة");
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=360;let w=im.width,h=im.height;if(w>h&&w>m){h=Math.round(h*m/w);w=m}else if(h>m){w=Math.round(w*m/h);h=m}
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);ph=c.toDataURL("image/jpeg",.65);
  const pp=$("#pp");pp.src=ph;pp.style.display="block";const e2=$("#pph");if(e2)e2.style.display="none"};im.src=r.result};r.readAsDataURL(f)})}
async function saveP(id){
 const name=$("#fName").value.trim(),date=$("#fD").value,g=$("#fG").value;
 if(!name)return toast("اكتب الاسم أولًا");
 if(date&&date>new Date().toISOString().slice(0,10))return toast("راجع تاريخ الوفاة");
 if(!id&&S.profiles.length>=1&&!isPro())return requirePro("multi",()=>saveP(id));
 const data={name,g,rel:$("#fR").value,date,photo:ph,memory:$("#fM").value.trim(),dua:$("#fU").value.trim()||defDua(g)};
 const b=$("#sb");b.disabled=true;
 try{
  let p;
  if(id){p=find(id);Object.assign(p,data)}else{p=Object.assign({id:newId(),count:0,shared:false,createdAt:Date.now()},data);S.profiles.unshift(p)}
  await FB.setDoc(pref(p.id),p);
  if(p.shared)publishPage(p).catch(()=>{});
  ph="";fresh=id?null:p.id;toast("تم الحفظ ✓");go("detail",p.id);
 }catch(e){toast("تعذّر الحفظ، تحقق من الإنترنت");b.disabled=false}
}
async function publishPage(p){
 const ref=FB.doc(FB.db,"pages",p.id),s=await FB.getDoc(ref);
 const d={owner:S.u.uid,n:p.name,g:p.g,r:p.rel,d:p.date||"",m:p.memory||"",u:p.dua,photo:p.photo||"",updatedAt:Date.now()};
 if(s.exists())await FB.updateDoc(ref,d);else await FB.setDoc(ref,Object.assign(d,{count:0,createdAt:Date.now()}));
 if(!p.shared){p.shared=true;await FB.updateDoc(pref(p.id),{shared:true})}

 const p=find(id);
 try{await publishPage(p)}catch(e){return toast("تعذّر إنشاء الرابط، حاول لاحقًا")}

 if(!/^https?:/.test(location.protocol))toast("الرابط يعمل بعد رفع الملف على استضافة");

async function loadFam(){const p=find(arg);if(!p||!p.shared)return;try{const s=await FB.getDoc(FB.doc(FB.db,"pages",p.id));const e=$("#fam");if(s.exists()&&e)e.textContent=s.data().count||0}catch(e){}}
function wrap(x,t,cx,y,mw,lh){let l="";for(const w of t.split(" ")){const tt=l?l+" "+w:w;if(x.measureText(tt).width>mw&&l){x.fillText(l,cx,y);y+=lh;l=w}else l=tt}x.fillText(l,cx,y);return y+lh}
async function shareCard(id){
 const p=find(id),c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
 const gr=x.createLinearGradient(0,0,0,1350);gr.addColorStop(0,"#184A3B");gr.addColorStop(1,"#0F3329");x.fillStyle=gr;x.fillRect(0,0,1080,1350);
 x.strokeStyle="#B8923F";x.lineWidth=4;x.strokeRect(40,40,1000,1270);
 x.direction="rtl";x.textAlign="center";let y=330;
 if(p.photo){await new Promise(r=>{const im=new Image();im.onload=()=>{x.save();x.beginPath();x.arc(540,300,150,0,7);x.clip();const s=Math.max(300/im.width,300/im.height);x.drawImage(im,540-im.width*s/2,300-im.height*s/2,im.width*s,im.height*s);x.restore();x.strokeStyle="#F1E4BE";x.lineWidth=6;x.beginPath();x.arc(540,300,150,0,7);x.stroke();r()};im.onerror=r;im.src=p.photo});y=530}
 x.fillStyle="#F1E4BE";x.font="34px Tajawal,Tahoma,Arial";x.fillText(who(p),540,y);
 x.fillStyle="#fff";x.font="bold 62px Tajawal,Tahoma,Arial";y=wrap(x,p.name,540,y+85,880,80);
 x.fillStyle="#CFE0D6";x.font="34px Tajawal,Tahoma,Arial";x.fillText(p.rel,540,y+10);y+=90;
 x.fillStyle="#fff";x.font="42px Tajawal,Tahoma,Arial";y=wrap(x,p.dua,540,y+30,860,78);
 x.fillStyle="#D4B467";x.font="30px Tajawal,Tahoma,Arial";x.fillText("صدقة جارية · دعاء ووفاء لمن نحب",540,1260);
 c.toBlob(async b=>{const f=new File([b],"sadaqa.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sadaqa.png";a.click();toast("تم تنزيل الصورة")}})}

/* ===== إدارة الأكواد (للمشرف فقط) ===== */
function rndCode(){const cs="ABCDEFGHJKMNPQRSTUVWXYZ23456789",a=new Uint32Array(8);crypto.getRandomValues(a);const s=[...a].map(n=>cs[n%cs.length]).join("");return"SJ-"+s.slice(0,4)+"-"+s.slice(4)}
async function genCodes(){
 const n=+$("#gn").value,b=$("#gb");b.disabled=true;
 try{for(let i=0;i<n;i++)await FB.setDoc(FB.doc(FB.db,"codes",rndCode()),{used:false,days:365,createdAt:Date.now()});toast("تم إنشاء "+n+" كود ✓");await loadCodes()}
 catch(e){toast("تعذّر الإنشاء، تأكد أن حسابك مشرف")}
 b.disabled=false}
async function loadCodes(){
 try{const s=await FB.getDocs(FB.query(FB.collection(FB.db,"codes"),FB.orderBy("createdAt","desc"),FB.limit(40)));codes=s.docs.map(d=>({id:d.id,...d.data()}));
  const el=$("#cl");if(!el)return;
  el.innerHTML=codes.length?codes.map(c=>`<div class="card row"><div style="flex:1"><span class="code">${c.id}</span><div class="mu">${c.used?"✓ مستخدم":"غير مستخدم"} · ${c.days} يوم</div></div>${c.used?"":`<button class="btn l s" onclick="copyT('${c.id}')">نسخ</button><button class="btn wa s" onclick="sendCode('${c.id}')">واتساب</button>`}</div>`).join(""):'<div class="card empty">لا توجد أكواد بعد.</div>'}
 catch(e){const el=$("#cl");if(el)el.innerHTML='<div class="card empty">تعذّر التحميل</div>'}}
function sendCode(c){const p=prompt("رقم واتساب العميل (01xxxxxxxxx)");if(!p)return;const n=p.replace(/\D/g,"").replace(/^0/,"20");openWA(`شكرًا لاشتراكك في صدقة جارية 🤍\nكود التفعيل الخاص بك:\n${c}\n\nافتح التطبيق ← حسابي ← اكتب الكود ← تفعيل.`,n)}

 try{

/* ===== البداية (تُستدعى بعد تحميل Firebase) ===== */
function boot(){
 const m=location.hash.match(/^#p=([\w-]+)$/);
 if(m)return publicView(m[1]);
 FB.onAuthStateChanged(FB.auth,async u=>{
  try{if(u){S.u=u;await loadAll()}else{S.u=null;S.ud=null;S.profiles=[]}}
  catch(e){toast("تعذّر تحميل بياناتك، تحقق من الإنترنت")}
  if(route==="auth"&&S.u)route="home";
  render();
  if(S.u&&afterAuth){const f=afterAuth;afterAuth=null;f()}
 });
}
